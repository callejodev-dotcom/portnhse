name: Compilar NHSE para Switch

# O editor que se abre na propia consola (consola/), coa imaxe oficial de devkitPro. Deixa NHSE.nro como artefacto.
on:
  push:
    paths: ["consola/**", ".github/workflows/consola.yml"]
  workflow_dispatch:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas (SDL2)
        run: dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-sdl2_image || true
      - name: Nomes de arquivo sen repetir (o Makefile xunta os .o polo nome)
        run: |
          dup=$(ls consola/source/app/*.cpp consola/source/core/*.cpp | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dup" ]; then echo "Repetidos: $dup"; exit 1; fi
      - name: Compilar
        run: make -C consola -j"$(nproc)"
      - uses: actions/upload-artifact@v7
        with:
          name: NHSE-switch
          path: |
            consola/NHSE.nro
            consola/NHSE.elf
