name: Compilar NHSE para Mac

# En cada subida: compila, pasa as probas e deixa os .dmg como artefactos.
# Ao subir unha etiqueta «v0.1.0»… publica a versión cos dous .dmg (Apple Silicon e Intel) e os dous .zip
# que descarga a propia app para actualizarse.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: A etiqueta ten que ser a versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "A etiqueta ${GITHUB_REF_NAME} non é v${VERSION} (Directory.Build.props)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compilar
        run: dotnet build PortNHSE.slnx -c Release -warnaserror

      - name: Probas
        run: dotnet test tests/NHSE.Mac.Tests -c Release --no-build

      - name: Empaquetar
        run: tools/empaquetar.sh arm64 x64

      - uses: actions/upload-artifact@v7
        with:
          name: NHSE-macOS
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publicar a versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.zip \
            --title "NHSE para Mac ${GITHUB_REF_NAME}" \
            --notes "Descarga o .dmg do teu Mac (arm64 = Apple Silicon, x64 = Intel). Instrucións no README. Se xa tes NHSE instalado, actualízase só (os .zip son para iso)."
